<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Logic Auditor</title>
  <style>
    :root{--green:#16B300;--deep:#087D48;--ink:#171717;--muted:#68706a;--line:#E5E7E5;--soft:#F7F8F7}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(1160px,calc(100% - 48px));margin:0 auto;padding:30px 0}.eyebrow{color:var(--deep);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:34px;letter-spacing:-.035em;margin:5px 0 3px}.subtitle{color:var(--muted);margin:0 0 22px;font-size:15px}.panel{border:1px solid var(--line);border-radius:12px;padding:20px;background:#fff}.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.select-wrap{position:relative;min-width:0}.select-wrap::after{content:'';position:absolute;right:17px;top:50%;width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}select,button{height:46px;font:inherit;line-height:1;border-radius:8px;padding:0 14px}select{display:block;width:100%;min-width:0;padding-right:46px;border:1px solid var(--line);background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none}button{border:0;background:var(--green);color:#fff;font-weight:750;cursor:pointer;white-space:nowrap}select:focus-visible,button:focus-visible{outline:3px solid rgba(22,179,0,.22);outline-offset:2px}button:disabled{opacity:.55;cursor:wait}.switch{display:flex;margin:14px 0 0;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--soft);width:max-content}.switch button{height:34px;background:transparent;color:var(--muted);padding:0 12px;font-size:12px}.switch button.active{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}.status{margin:16px 0 0;padding:10px 12px;border-left:3px solid var(--deep);background:var(--soft);font-size:13px}.status.error{border-color:#b62929;color:#801d1d;background:#fff7f7}.result-area{display:none;grid-template-columns:minmax(0,.9fr) minmax(360px,1.1fr);gap:28px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.category{grid-column:1/-1;color:var(--muted);font-size:12px;margin-bottom:-12px}.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}.time{border:1px solid var(--line);border-radius:10px;padding:14px}.time span{display:block;color:var(--muted);font-size:12px}.time strong{display:block;font-size:25px;margin-top:4px}.bars{display:grid;align-content:center;gap:18px;padding:12px 0}.bar-row{display:grid;grid-template-columns:92px 1fr 76px;gap:10px;align-items:center;font-size:12px}.track{height:18px;background:var(--soft);border:1px solid var(--line);border-radius:999px;overflow:hidden}.bar{height:100%;min-width:3%;border-radius:999px;background:var(--green)}.bar.sqlite{background:var(--deep)}.value{text-align:right;font-variant-numeric:tabular-nums}.finding{font-size:13px;margin:14px 0 0}.verified{display:flex;align-items:center;gap:7px;margin-top:10px;color:var(--deep);font-size:13px;font-weight:700}.verified::before{content:'✓';display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#edf8eb;color:var(--green)}@media(max-width:760px){.shell{width:min(1160px,calc(100% - 32px));padding:20px 0}.controls{grid-template-columns:1fr}.controls>button{width:100%}.result-area{grid-template-columns:1fr;gap:14px}.category{margin-bottom:0}.bars{padding:4px 0}.times{grid-template-columns:1fr 1fr}}@media(max-width:480px){.times{grid-template-columns:1fr}.bar-row{grid-template-columns:78px 1fr 68px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">Experiment 01</div>
    <h1>The Logic Auditor</h1>
    <p class="subtitle">CSV/Pandas vs SQLite</p>
    <section class="panel">
      <div class="controls">
        <div class="select-wrap"><select id="scenario" aria-label="Benchmark scenario">{% for scenario in scenarios %}<option value="{{ scenario }}">{{ scenario }}</option>{% endfor %}</select></div>
        <button id="run">Run Comparison</button>
      </div>
      <div class="switch" aria-label="Measurement category">
        <button class="category-button active" data-category="End-to-end">End-to-end</button>
        <button class="category-button" data-category="Warm query">Warm query</button>
      </div>
      <div id="status" class="status">Select a scenario and run the comparison.</div>
      <div id="result-area" class="result-area">
        <div id="category-label" class="category"></div>
        <div class="summary">
          <div class="times">
            <div class="time"><span>CSV/Pandas</span><strong id="pandas-time"></strong></div>
            <div class="time"><span>SQLite</span><strong id="sqlite-time"></strong></div>
          </div>
          <p id="finding" class="finding"></p>
          <div id="verified" class="verified"></div>
        </div>
        <div class="bars">
          <div class="bar-row"><span>CSV/Pandas</span><div class="track"><div id="pandas-bar" class="bar"></div></div><span id="pandas-value" class="value"></span></div>
          <div class="bar-row"><span>SQLite</span><div class="track"><div id="sqlite-bar" class="bar sqlite"></div></div><span id="sqlite-value" class="value"></span></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const run=document.querySelector('#run'),scenario=document.querySelector('#scenario'),statusBox=document.querySelector('#status'),area=document.querySelector('#result-area');let category='End-to-end',measurement=null;
    const render=()=>{if(!measurement)return;const rows=measurement.results.filter(row=>row.category===category),pandas=rows.find(row=>row.system.includes('Pandas')),sqlite=rows.find(row=>row.system==='SQLite'),largest=Math.max(pandas.median_ms,sqlite.median_ms),faster=pandas.median_ms<sqlite.median_ms?'CSV/Pandas':'SQLite';document.querySelector('#category-label').textContent=`${category} retrieval · median of ${pandas.repetitions} measured repetitions · milliseconds`;document.querySelector('#pandas-time').textContent=`${pandas.median_ms.toFixed(3)} ms`;document.querySelector('#sqlite-time').textContent=`${sqlite.median_ms.toFixed(3)} ms`;document.querySelector('#pandas-value').textContent=`${pandas.median_ms.toFixed(3)} ms`;document.querySelector('#sqlite-value').textContent=`${sqlite.median_ms.toFixed(3)} ms`;document.querySelector('#pandas-bar').style.width=`${pandas.median_ms/largest*100}%`;document.querySelector('#sqlite-bar').style.width=`${sqlite.median_ms/largest*100}%`;document.querySelector('#finding').textContent=`${faster} was faster for this scenario and measurement category.`;document.querySelector('#verified').textContent=measurement.matched?'Equivalent results verified':'Results did not match';area.style.display='grid'};
    document.querySelectorAll('.category-button').forEach(button=>button.addEventListener('click',()=>{category=button.dataset.category;document.querySelectorAll('.category-button').forEach(item=>item.classList.toggle('active',item===button));render()}));
    run.addEventListener('click',async()=>{run.disabled=true;run.textContent='Running…';statusBox.className='status';statusBox.textContent='Measuring both systems…';area.style.display='none';try{const response=await fetch('/api/benchmark/'+encodeURIComponent(scenario.value),{method:'POST'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Benchmark failed');measurement=data;statusBox.textContent=`Completed: ${data.scenario}`;render()}catch(error){measurement=null;statusBox.className='status error';statusBox.textContent=error.message}finally{run.disabled=false;run.textContent='Run Comparison'}});
  </script>
</body>
</html>
