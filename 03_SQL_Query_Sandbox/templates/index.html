<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL Query Sandbox</title>
  <style>
    :root{--green:#16B300;--deep:#087D48;--ink:#171717;--muted:#68706a;--line:#E5E7E5;--soft:#F7F8F7}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}.shell{width:min(1160px,calc(100% - 48px));margin:0 auto;padding:26px 0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}.eyebrow{color:var(--deep);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:32px;letter-spacing:-.035em;margin:4px 0 2px}.subtitle{color:var(--muted);margin:0;font-size:14px}.connection{display:flex;align-items:center;gap:7px;margin-top:7px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#a0a5a1}.connection.ok .dot{background:var(--green)}.connection.bad{color:#8c2020}.connection.bad .dot{background:#b62929}.panel{border:1px solid var(--line);border-radius:12px;padding:18px}.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.select-wrap{position:relative;min-width:0}.select-wrap::after{content:'';position:absolute;right:17px;top:50%;width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}select,button{height:46px;font:inherit;line-height:1;border-radius:8px;padding:0 14px}select{display:block;width:100%;min-width:0;padding-right:46px;border:1px solid var(--line);background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none}button{border:0;background:var(--green);color:#fff;font-weight:750;cursor:pointer;white-space:nowrap}select:focus-visible,button:focus-visible{outline:3px solid rgba(22,179,0,.22);outline-offset:2px}button:disabled{opacity:.55;cursor:wait}.sql-label{display:block;margin:14px 0 6px;color:var(--muted);font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.06em}.sql{margin:0;background:#171717;color:#f3f6f3;border-radius:9px;padding:12px 14px;white-space:pre-wrap;overflow:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;max-height:132px}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 8px}.result-head h2{font-size:16px;margin:0}.count{color:var(--deep);font-size:12px;font-weight:800}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;max-width:100%;max-height:390px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}th{position:sticky;top:0;background:var(--soft);font-size:10px;text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border-bottom:0}.empty,.loading{padding:20px;text-align:center;color:var(--muted);font-size:13px}.error{margin:12px;padding:11px;border-left:3px solid #b62929;background:#fff7f7;color:#7f1c1c;font-size:13px}@media(max-width:620px){.shell{width:min(1160px,calc(100% - 32px));padding:18px 0}.top{display:block}.connection{width:max-content;margin-top:12px}.controls{grid-template-columns:1fr}.controls button{width:100%}.table-wrap{max-height:360px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">Experiment 03</div><h1>SQL Query Sandbox</h1><p class="subtitle">Browse university tables and run predefined SELECT queries</p></div>
      <div id="connection" class="connection"><span class="dot"></span><span>Checking MariaDB…</span></div>
    </header>
    <section class="panel">
      <div class="controls">
        <div class="select-wrap"><select id="operation" aria-label="Database operation">
          {% for group, choices in operations.items()|groupby('1.group') %}<optgroup label="{{ group }}">{% for id, operation in choices %}<option value="{{ id }}" data-sql="{{ operation.sql|e }}">{{ operation.title }}</option>{% endfor %}</optgroup>{% endfor %}
        </select></div>
        <button id="run">Run Query</button>
      </div>
      <span class="sql-label">SQL statement</span>
      <pre id="sql" class="sql"></pre>
      <div class="result-head"><h2 id="result-title">Results</h2><span id="count" class="count"></span></div>
      <div id="results" class="table-wrap"><div class="empty">Select an operation, then click Run Query.</div></div>
    </section>
  </main>
  <script>
    const operation=document.querySelector('#operation'),sql=document.querySelector('#sql'),run=document.querySelector('#run'),results=document.querySelector('#results'),count=document.querySelector('#count'),title=document.querySelector('#result-title'),connection=document.querySelector('#connection');
    const escapeText=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const selectedSql=()=>operation.options[operation.selectedIndex].dataset.sql;
    const clearResults=()=>{title.textContent='Results';count.textContent='';results.innerHTML='<div class="empty">Click Run Query to execute the selected operation.</div>'};
    const render=data=>{title.textContent=data.title;count.textContent=`${data.count} row${data.count===1?'':'s'}${data.truncated?' shown':''}`;if(!data.rows.length){results.innerHTML='<div class="empty">No records matched this query.</div>';return}results.innerHTML=`<table><thead><tr>${data.columns.map(column=>`<th>${escapeText(column)}</th>`).join('')}</tr></thead><tbody>${data.rows.map(row=>`<tr>${data.columns.map(column=>`<td>${escapeText(row[column])}</td>`).join('')}</tr>`).join('')}</tbody></table>`};
    operation.addEventListener('change',()=>{sql.textContent=selectedSql();clearResults()});sql.textContent=selectedSql();
    run.addEventListener('click',async()=>{run.disabled=true;run.textContent='Running…';results.innerHTML='<div class="loading">Loading actual database results…</div>';count.textContent='';try{const response=await fetch('/api/operation/'+encodeURIComponent(operation.value),{method:'POST'}),data=await response.json();if(!response.ok)throw new Error(data.error||'Query failed');if(data.sql!==selectedSql())throw new Error('Operation and SQL response did not match.');render(data)}catch(error){results.innerHTML=`<div class="error">${escapeText(error.message)}</div>`}finally{run.disabled=false;run.textContent='Run Query'}});
    fetch('/api/status').then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error);connection.className='connection ok';connection.innerHTML=`<span class="dot"></span><span>MariaDB ${escapeText(data.version)}</span>`}).catch(error=>{connection.className='connection bad';connection.innerHTML='<span class="dot"></span><span>MariaDB unavailable</span>';results.innerHTML=`<div class="error">${escapeText(error.message)}</div>`});
  </script>
</body>
</html>
